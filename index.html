<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="vz-admin-chunk" content="" />
  <script>
    // Pre-paint (Prompt 14, self hosted fonts in Prompt 15): the theme for both
    // halves, the admin's motion switch, and which boot frame to show, all read
    // from localStorage before the first paint. Marketing: a saved choice wins,
    // otherwise the OS. Admin: dark unless Rob picked light or system in Settings.
    // The display weights each host paints first are preloaded here (the admin uses one, the
    // marketing site two); the rest of the latin subsets arrive through src/fonts.css. This script's
    // hash is pinned in the admin Content-Security-Policy (vercel.json); the
    // build fails if the two drift (vite.config.js).
    (function () {
      var de = document.documentElement, ls = {}, osLight = false;
      try { ls.theme = localStorage.getItem('vz_theme'); ls.motion = localStorage.getItem('vz_motion'); ls.boot = localStorage.getItem('vz_boot'); ls.side = localStorage.getItem('vz_shell_collapsed'); } catch (e) {}
      try { osLight = window.matchMedia('(prefers-color-scheme: light)').matches; } catch (e) {}
      var admin = /^admin\./.test(location.hostname) || /^\/admin(\/|$)/.test(location.pathname);
      var t = (ls.theme === 'light' || ls.theme === 'dark') ? ls.theme : (admin && ls.theme !== 'system') ? 'dark' : (osLight ? 'light' : 'dark');
      de.dataset.theme = t;
      if (admin) {
        de.dataset.vTheme = t;
        if (ls.motion === 'reduce') de.dataset.vMotion = 'reduce';
        de.dataset.vzBoot = ls.boot === '1' ? 'shell' : 'login';
        if (ls.side === 'true') de.dataset.vzSide = 'rail';
      }
      var fonts = admin ? ['barlow-condensed-700'] : ['barlow-condensed-700', 'barlow-condensed-800'];
      for (var i = 0; i < fonts.length; i++) {
        var l = document.createElement('link'); l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2'; l.crossOrigin = 'anonymous'; l.href = '/fonts/' + fonts[i] + '.woff2';
        document.head.appendChild(l);
      }
      // The admin shell chunk (named by the build in the meta tag) downloads alongside the entry instead of after it.
      var chunk = admin && document.querySelector('meta[name="vz-admin-chunk"]');
      if (chunk && chunk.content) { var m = document.createElement('link'); m.rel = 'modulepreload'; m.href = chunk.content; document.head.appendChild(m); }
    })();
  </script>
  <!-- vz-boot-css -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Visualize: a solo brand development and website design studio. I create logos, brand identity, websites, print design, and digital business setup for local businesses." />
  <title>Visualize: Brand & Website Design Studio</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="theme-color" content="#080808" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Visualize." />
  <meta name="mobile-web-app-capable" content="yes" />
</head>
<body>
  <div id="root"><!-- vz-boot --></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
