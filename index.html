<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="vz-admin-chunk" content="" />
  <!-- The public site's manifest (the logo pack's site.webmanifest). It sits above the script so the script can point
       the admin host at its own manifest before the browser reads the tag. -->
  <link rel="manifest" href="/site.webmanifest" />
  <script>
    // Pre-paint (Prompt 14, self hosted fonts in Prompt 15): the theme for both
    // halves, the admin's motion switch, and which boot frame to show, all read
    // from localStorage before the first paint. Marketing: a saved choice wins,
    // otherwise the OS. Admin: dark unless Rob picked light or system in Settings.
    // The display weights each host paints first are preloaded here (the admin uses one, the
    // marketing site two); the rest of the latin subsets arrive through src/fonts.css. This script's
    // hash is pinned in the admin Content-Security-Policy (vercel.json); the
    // build fails if the two drift (vite.config.js).
    (function () {
      var de = document.documentElement, ls = {}, osLight = false;
      try { ls.theme = localStorage.getItem('vz_theme'); ls.motion = localStorage.getItem('vz_motion'); ls.boot = localStorage.getItem('vz_boot'); ls.side = localStorage.getItem('vz_shell_collapsed'); } catch (e) {}
      try { osLight = window.matchMedia('(prefers-color-scheme: light)').matches; } catch (e) {}
      var admin = /^admin\./.test(location.hostname) || /^\/admin(\/|$)/.test(location.pathname);
      // Site Prompt 7, Part 5: the public site is dark only, so the OS
      // preference and the stored choice decide nothing there any more; the
      // admin keeps its own picker exactly as it was.
      var t = admin ? ((ls.theme === 'light' || ls.theme === 'dark') ? ls.theme : (ls.theme === 'system' ? (osLight ? 'light' : 'dark') : 'dark')) : 'dark';
      de.dataset.theme = t;
      if (admin) {
        de.dataset.vTheme = t;
        if (ls.motion === 'reduce') de.dataset.vMotion = 'reduce';
        de.dataset.vzBoot = ls.boot === '1' ? 'shell' : 'login';
        if (ls.side === 'true') de.dataset.vzSide = 'rail';
      }
      // One manifest per host: the pack's site.webmanifest on the public site, the admin's own on the admin host.
      if (admin) { var mf = document.querySelector('link[rel="manifest"]'); if (mf) mf.setAttribute('href', '/manifest.webmanifest'); }
      var fonts = admin ? ['barlow-condensed-700'] : ['barlow-condensed-700', 'barlow-condensed-800'];
      for (var i = 0; i < fonts.length; i++) {
        var l = document.createElement('link'); l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2'; l.crossOrigin = 'anonymous'; l.href = '/fonts/' + fonts[i] + '.woff2';
        document.head.appendChild(l);
      }
      // The admin shell chunk (named by the build in the meta tag) downloads alongside the entry instead of after it.
      var chunk = admin && document.querySelector('meta[name="vz-admin-chunk"]');
      if (chunk && chunk.content) { var m = document.createElement('link'); m.rel = 'modulepreload'; m.href = chunk.content; document.head.appendChild(m); }
    })();
  </script>
  <!-- vz-boot-css -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Visualize: a solo brand development and website design studio. I create logos, brand identity, websites, print design, and digital business setup for local businesses." />
  <title>Visualize: Brand & Website Design Studio</title>
  <!-- The static default a crawler or link preview sees on any route this
       build does not prerender (see docs/RUNBOOK.md, "Prerender"); every
       page's own useHead() call (src/marketing/useHead.js) overwrites these
       after the SPA's JS runs. The icon, theme-color and share
       image tags (and the manifest link above the script) are the logo pack's head-snippet.html (Brand v3), one
       block: scripts/logo-check.mjs asserts every file they name exists.
       The admin host is served this same file; the pre-paint script above
       points its manifest link at the admin's own manifest. -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="apple-mobile-web-app-title" content="Visualize." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta property="og:site_name" content="Visualize." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Visualize. Brand and website design for local businesses" />
  <meta property="og:description" content="Visualize: a solo brand development and website design studio. I create logos, brand identity, websites, print design, and digital business setup for local businesses." />
  <meta property="og:image" content="https://visualizestudio.org/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Visualize. Brand and website design" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://visualizestudio.org/og-image.png" />
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Visualize.","url":"https://visualizestudio.org","logo":"https://visualizestudio.org/icon-512.png","image":"https://visualizestudio.org/og-image.png"}</script>
</head>
<body>
  <div id="root"><!-- vz-boot --></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
